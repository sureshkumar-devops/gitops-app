name: Build and Push Docker Image

on:
  push: 
    branches:
      - master
      - dev
      - staging
jobs:
  build:
   runs-on: ubuntu-latest

   steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set Image Tag
      id: vars
      run: |
       BRANCH_NAME=${GITHUB_REF##*/}    
       SHORT_SHA=${GITHUB_SHA::7}
       echo "TAG=${BRANCH_NAME}-${SHORT_SHA}" >> $GITHUB_ENV
    
    - name: Login Docker Hub   
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile  
        push: true
        tags: ${{ vars.DOCKER_USERNAME }}/gitops-app:${{ env.TAG }}      

    - name: Clone Gitops Repo
      run: |
        git clone https://x-access-token:${{ secrets.GITOPS_TOKEN }}@github.com/${{ github.repository }}.git

    - name: Update Image Tags
      run: |
        cd /${{ github.repository }}

        BRANCH_NAME=${GITHUB_REF##*/}
        
        if [ "$BRANCH_NAME" == "master" ]; then
          ENV="prod"
          TARGET_BRANCH="master"
        else
          ENV="$BRANCH_NAME"
          TARGET_BRANCH="$BRANCH_NAME"
        fi
   
        sed -i "s/tag:.*/tag: \"${{ env.TAG }}\"/" environments/$ENV/values.yaml
        
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"

        git add .
        git commit -m "Update $ENV Image to ${{ env.TAG }}"

        git push origin $TARGET_BRANCH


 
